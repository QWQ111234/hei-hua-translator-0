<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑话翻译器 · AI / 计算机版</title>
<style>
  :root{
    --bg:#f3f5fb; --card:#ffffff; --ink:#1f2433; --sub:#6b7280;
    --line:#e7eaf3; --brand:#4f6bff; --brand2:#22c3d4;
    --ai:#4f6bff; --ai-bg:#eef1ff;
    --math:#d97706; --math-bg:#fef3e2;
    --cs:#059669; --cs-bg:#e6f7f0;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px}

  /* header */
  header{text-align:center;padding:18px 0 22px}
  .logo{
    display:inline-flex;align-items:center;gap:10px;
    font-size:30px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(120deg,var(--brand),var(--brand2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .logo .gear{font-size:28px;-webkit-text-fill-color:initial}
  header p{color:var(--sub);font-size:14.5px;margin-top:8px}

  /* tabs */
  .tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
  .tab{
    border:1px solid var(--line);background:#fff;color:var(--sub);
    padding:8px 22px;border-radius:999px;font-size:14.5px;cursor:pointer;
    transition:all .15s;font-weight:600;
  }
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;margin-bottom:16px;
    box-shadow:0 2px 10px rgba(40,60,120,.04);
  }

  textarea{
    width:100%;min-height:130px;resize:vertical;border:1.5px solid var(--line);
    border-radius:12px;padding:14px;font-size:15.5px;font-family:inherit;
    line-height:1.8;color:var(--ink);outline:none;transition:border-color .15s;
  }
  textarea:focus{border-color:var(--brand)}
  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;flex-wrap:wrap;gap:8px}
  .count{font-size:12.5px;color:var(--sub)}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  button.act{
    border:none;border-radius:10px;padding:10px 22px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .1s,opacity .15s;
  }
  button.act:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(120deg,var(--brand),#7a5cff);color:#fff}
  .btn-ghost{background:#f1f3f9;color:var(--ink)}
  .btn-small{padding:7px 14px;font-size:13px;border-radius:8px}

  .examples{margin-top:14px}
  .examples .lab{font-size:13px;color:var(--sub);margin-bottom:8px}
  .chip{
    display:inline-block;background:#f4f6fc;border:1px solid var(--line);
    color:#44507a;font-size:13px;padding:6px 12px;border-radius:999px;
    margin:0 8px 8px 0;cursor:pointer;transition:all .15s;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand)}

  .sec-title{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sec-title .num{
    font-size:12.5px;font-weight:600;color:var(--brand);
    background:var(--ai-bg);padding:2px 10px;border-radius:999px;
  }
  .tip{font-size:12.5px;color:var(--sub);font-weight:400}

  .sentence{
    font-size:16px;line-height:2.1;padding:14px 16px;border-radius:12px;
    background:#fafbfe;border:1px dashed var(--line);
  }
  .sentence mark{
    background:#dbe3ff;color:#2f45b8;border-radius:5px;padding:0 4px;
    font-weight:700;
  }
  .plain-box{background:#f1faf6;border:1px solid #cdeede;border-radius:12px;padding:16px}
  .plain-text{font-size:16.5px;line-height:2.2;color:#173b2c}
  .rp{
    color:#0a7a52;font-weight:700;border-bottom:2px dashed #67c7a5;
    cursor:help;padding:0 1px;
  }
  .bracket{color:#67c7a5;font-weight:700}

  .term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:6px}
  .term-card{
    border:1px solid var(--line);border-radius:12px;padding:13px 15px;
    background:#fff;transition:box-shadow .15s;
  }
  .term-card:hover{box-shadow:0 4px 14px rgba(40,60,120,.08)}
  .term-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .term-name{font-size:15.5px;font-weight:800}
  .term-en{font-size:12px;color:#9aa1b2;font-style:italic}
  .badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px}
  .b-ai{background:var(--ai-bg);color:var(--ai)}
  .b-math{background:var(--math-bg);color:var(--math)}
  .b-cs{background:var(--cs-bg);color:var(--cs)}
  .term-desc{font-size:13.5px;color:#454c5f;line-height:1.75}

  .empty{color:var(--sub);font-size:14px;text-align:center;padding:26px 10px}
  .empty b{color:var(--brand)}

  /* glossary */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input[type=text]{
    flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 14px;font-size:14.5px;outline:none;font-family:inherit;
  }
  .toolbar input[type=text]:focus{border-color:var(--brand)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filter{
    border:1px solid var(--line);background:#fff;color:var(--sub);
    padding:7px 16px;border-radius:999px;font-size:13.5px;cursor:pointer;font-weight:600;
  }
  .filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .glossary-count{font-size:13px;color:var(--sub);margin-bottom:12px}

  footer{text-align:center;color:#9aa1b2;font-size:12.5px;margin-top:30px;line-height:1.9}
  .hide{display:none}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;
    font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="gear">🛠️</span>黑话翻译器</div>
    <p>专治 AI / 计算机课堂黑话 —— 整句翻成大白话，专业名词逐个标注</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-view="translator">📖 翻译</button>
    <button class="tab" data-view="glossary">📚 词库</button>
  </div>

  <!-- ========== 翻译视图 ========== -->
  <section id="view-translator">
    <div class="card">
      <textarea id="input" placeholder="把老师课件、板书或教材里看不懂的那句话整段贴进来，例如：&#10;卷积神经网络通过反向传播算法不断优化模型参数，从而提升图像分类任务的准确率。"></textarea>
      <div class="meta-row">
        <span class="count" id="charCount">0 字</span>
        <div class="btns">
          <button class="act btn-ghost" id="clearBtn">清空</button>
          <button class="act btn-primary" id="goBtn">翻译成大白话</button>
        </div>
      </div>
      <div class="examples">
        <div class="lab">不知道怎么用？点个例句试试 👇</div>
        <span class="chip" data-ex="0">例句 1 · CNN 与反向传播</span>
        <span class="chip" data-ex="1">例句 2 · 大语言模型与 Token</span>
        <span class="chip" data-ex="2">例句 3 · 学习率与过拟合</span>
      </div>
    </div>

    <div id="resultArea" class="hide">
      <div class="card">
        <div class="sec-title">📝 原句 <span class="tip">专业词已高亮</span></div>
        <div class="sentence" id="origOut"></div>
      </div>

      <div class="card">
        <div class="sec-title">💡 整句大白话
          <span class="tip">「」里是把专业词替换成大白话后的说法</span>
          <button class="act btn-ghost btn-small" id="copyBtn" style="margin-left:auto">复制</button>
        </div>
        <div class="plain-box"><div class="plain-text" id="plainOut"></div></div>
      </div>

      <div class="card">
        <div class="sec-title">🏷 专业名词标注 <span class="num" id="termNum">0 个</span></div>
        <div class="term-grid" id="termCards"></div>
      </div>
    </div>

    <div class="card" id="welcomeCard">
      <div class="empty">把听不懂的句子贴到上面，点<b>「翻译成大白话」</b>，就能看到：<br>① 整句话的白话版 &nbsp; ② 每个专业词单独的解释标注</div>
    </div>
  </section>

  <!-- ========== 词库视图 ========== -->
  <section id="view-glossary" class="hide">
    <div class="card">
      <div class="toolbar">
        <input type="text" id="glossSearch" placeholder="搜索词库，如：梯度、CNN、递归、API …">
        <div class="filters">
          <button class="filter active" data-cat="all">全部</button>
          <button class="filter" data-cat="ai">人工智能</button>
          <button class="filter" data-cat="math">数学基础</button>
          <button class="filter" data-cat="cs">计算机通用</button>
        </div>
      </div>
      <div class="glossary-count" id="glossCount"></div>
      <div class="term-grid" id="glossList"></div>
    </div>
  </section>

  <footer>
    本工具在浏览器本地运行，无需联网 🔒<br>
    遇到词库里还没有的词，把整句话发给你的 Agent，就能补充进词库
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 词库 =================
   t: 术语 | a: 别名(英文缩写等) | en: 英文
   cat: ai / math / cs | say: 白话替换短语(直接塞进句子) | d: 详细解释 */
const GLOSSARY = [
  /* ---------- 人工智能 ---------- */
  {t:"人工智能", a:["AI"], en:"Artificial Intelligence", cat:"ai",
   say:"让机器像人一样会看、会听、会思考、会学习的技术",
   d:"让机器模仿人类的感知、思考和决策能力，能完成识别、对话、推理等通常需要人来做的任务。"},
  {t:"机器学习", a:[], en:"Machine Learning", cat:"ai",
   say:"让计算机自己从大量数据里总结规律",
   d:"不靠程序员把规则一条条写死，而是给计算机大量数据，让它自己找规律、学会做判断。"},
  {t:"深度学习", a:[], en:"Deep Learning", cat:"ai",
   say:"用很多层「神经网络」自动学习规律的技术",
   d:"机器学习的一个分支，用结构很深、层数很多的神经网络自动从数据里提取特征，是当前 AI 爆发的核心技术。"},
  {t:"神经网络", a:[], en:"Neural Network", cat:"ai",
   say:"一种模仿大脑神经元连接方式、一层层处理信息的计算模型",
   d:"由大量人工神经元按层连接组成的数学模型，数据从输入层经过一层层计算，最后在输出层得到结果。"},
  {t:"神经元", a:["节点"], en:"Neuron / Node", cat:"ai",
   say:"神经网络里做一次简单计算的小单元",
   d:"神经网络最基本的计算单位，接收上一层传来的数字，加权求和再经过激活函数，把结果传给下一层。"},
  {t:"卷积神经网络", a:["CNN"], en:"Convolutional Neural Network", cat:"ai",
   say:"一种特别擅长处理图片的神经网络",
   d:"通过「卷积」小窗口在图像上滑动来提取边缘、纹理等局部特征，是图像识别、目标检测最常用的网络。"},
  {t:"循环神经网络", a:["RNN"], en:"Recurrent Neural Network", cat:"ai",
   say:"一种擅长处理有先后顺序的数据（比如句子）的神经网络",
   d:"网络内部带有「记忆」，处理当前信息时会结合前面的信息，适合文本、语音、时间序列等有顺序的数据。"},
  {t:"注意力机制", a:["Attention"], en:"Attention Mechanism", cat:"ai",
   say:"让模型像人一样把注意力集中到重点内容上",
   d:"模型在处理某个位置时，自动判断输入中哪些部分更重要、给它们更高权重，是 Transformer 和大模型的核心。"},
  {t:"大语言模型", a:["LLM","LLMs"], en:"Large Language Model", cat:"ai",
   say:"读了海量文字、学会理解和生成人话的 AI 模型",
   d:"在海量文本上训练的超大规模模型，能理解语言并生成回答、写作、翻译等，ChatGPT、DeepSeek 都属于大语言模型。"},
  {t:"生成式人工智能", a:["AIGC"], en:"Generative AI", cat:"ai",
   say:"能自己生成文字、图片、声音等新内容的 AI",
   d:"不只做分类和判断，而是根据提示创造出新内容，比如写文章、画图、生成音乐和视频。"},
  {t:"自然语言处理", a:["NLP"], en:"Natural Language Processing", cat:"ai",
   say:"让计算机听懂、读懂、写出人类语言的技术",
   d:"研究人与计算机之间用自然语言沟通的技术，包括分词、机器翻译、问答系统、文本生成等方向。"},
  {t:"计算机视觉", a:["CV"], en:"Computer Vision", cat:"ai",
   say:"让计算机「看懂」图片和视频的技术",
   d:"让摄像头和计算机代替人眼和大脑，完成图像分类、人脸识别、目标检测、自动驾驶感知等任务。"},
  {t:"语音识别", a:[], en:"Speech Recognition", cat:"ai",
   say:"让计算机把人说的话转成文字",
   d:"把语音信号自动转换成对应文字的技术，手机语音输入、智能音箱背后都是它。"},
  {t:"智能体", a:["Agent"], en:"AI Agent", cat:"ai",
   say:"能自己规划、调用工具、一步步完成任务的 AI",
   d:"不只回答问题，还能自主拆解目标、调用搜索/代码等工具、连续执行直到完成任务的智能程序。"},
  {t:"多模态", a:[], en:"Multimodal", cat:"ai",
   say:"能同时处理文字、图片、声音等多种形式的信息",
   d:"「模态」指信息的形式。多模态模型可以同时看懂图、听懂话、读文字并互相关联起来理解。"},
  {t:"模型", a:[], en:"Model", cat:"ai",
   say:"用数据训练出来、能完成特定任务的一套「程序」",
   d:"用算法和数据训练得到的成果，内部是大量参数，输入新数据就能输出判断或预测结果。"},
  {t:"大模型", a:[], en:"Large Model / Foundation Model", cat:"ai",
   say:"参数规模特别大、什么都能聊一点的 AI 模型",
   d:"参数达到几十上百亿甚至更多的模型，能力泛、通用性强，可以在一个模型上做各种不同任务。"},
  {t:"训练", a:[], en:"Training", cat:"ai",
   say:"让模型反复看数据、不断自我调整的学习过程",
   d:"把数据喂给模型，根据它每次答错的程度调整参数，反复多轮，直到模型表现足够好。"},
  {t:"推理", a:["inference"], en:"Inference", cat:"ai",
   say:"训练好的模型拿新数据实际去做判断",
   d:"模型训练完成后进入使用阶段，对没见过的新输入计算出结果，这个过程叫推理（也叫推断）。"},
  {t:"预测", a:[], en:"Prediction", cat:"ai",
   say:"模型对新数据给出答案",
   d:"训练好的模型根据输入估计未知结果，比如判断邮件是不是垃圾邮件、预测明天的气温。"},
  {t:"数据集", a:[], en:"Dataset", cat:"ai",
   say:"收集起来给模型学习和考试用的一堆数据",
   d:"按一定结构整理的数据集合，比如几十万张带标注的图片、几万条聊天记录，是机器学习的「原材料」。"},
  {t:"训练集", a:[], en:"Training Set", cat:"ai",
   say:"专门给模型「做练习题」用的数据",
   d:"训练过程中模型能看到、用来调整参数的那部分数据，相当于平时的课本和练习题。"},
  {t:"验证集", a:[], en:"Validation Set", cat:"ai",
   say:"训练中途用来「模考」的数据",
   d:"训练中不参与调参，用来检验阶段性效果、帮助选择超参数，相当于模拟考试。"},
  {t:"测试集", a:[], en:"Test Set", cat:"ai",
   say:"最后用来「期末考试」的数据",
   d:"训练全程都不碰的数据，训练结束后用它评估模型对全新数据的真实水平。"},
  {t:"标签", a:[], en:"Label", cat:"ai",
   say:"每条数据附带的正确答案",
   d:"监督学习中给数据标注的答案，比如图片旁边写明「猫」、邮件旁边标明「垃圾邮件」。"},
  {t:"监督学习", a:[], en:"Supervised Learning", cat:"ai",
   say:"用带标准答案的题让模型照着学",
   d:"训练数据每条都带正确答案（标签），模型根据自己的答案和标准答案的差距来学习。"},
  {t:"无监督学习", a:[], en:"Unsupervised Learning", cat:"ai",
   say:"不给答案，让模型自己从数据里找规律",
   d:"数据没有标签，模型自己发现数据的结构，比如自动把相似用户分群、发现异常数据。"},
  {t:"强化学习", a:[], en:"Reinforcement Learning", cat:"ai",
   say:"靠「做对给奖励、做错给惩罚」反复试错来学习",
   d:"智能体在环境中采取行动，根据奖励或惩罚不断调整策略，AlphaGo、机器人控制都用它。"},
  {t:"分类", a:[], en:"Classification", cat:"ai",
   say:"判断东西属于哪一类（比如猫还是狗）",
   d:"模型的输出是离散类别，如垃圾邮件/正常邮件、阳性/阴性、图片里是猫还是狗。"},
  {t:"回归", a:[], en:"Regression", cat:"ai",
   say:"预测一个具体数字（比如房价、气温）",
   d:"模型输出连续数值的任务，如根据面积、地段预测房价，根据历史数据预测销量。"},
  {t:"聚类", a:[], en:"Clustering", cat:"ai",
   say:"不给类别，让模型自动把相似的数据分成一堆一堆",
   d:"无监督学习任务，按数据的相似程度自动分组，常用于用户分群、新闻归类、图像压缩。"},
  {t:"特征", a:[], en:"Feature", cat:"ai",
   say:"从原始数据里挑出来的、对判断有用的信息",
   d:"模型实际用来做判断的输入信息，比如预测房价时的面积、楼层、地段，都是特征。"},
  {t:"特征工程", a:[], en:"Feature Engineering", cat:"ai",
   say:"人工琢磨「给模型看哪些信息更有用」的工作",
   d:"利用领域知识从原始数据中提取、变换、筛选特征，往往直接决定模型效果的上限。"},
  {t:"算法", a:[], en:"Algorithm", cat:"ai",
   say:"解决一类问题的固定步骤和方法",
   d:"为解决某个问题设计的一系列明确、有限的计算步骤，程序就是算法的具体实现。"},
  {t:"参数", a:[], en:"Parameter", cat:"ai",
   say:"模型内部可以自动调整的无数个数字",
   d:"模型在训练中不断修改的内部数值，训练的本质就是找到一组合适的参数。"},
  {t:"权重", a:[], en:"Weight", cat:"ai",
   say:"模型内部决定每个输入有多重要的数字",

/* ========== 构建匹配模式（长的优先） ========== */
const PATTERNS = [];
GLOSSARY.forEach(e=>{
  PATTERNS.push({s:e.t, entry:e, ascii:/^[\x00-\x7F]+$/.test(e.t)});
  (e.a||[]).forEach(a=>PATTERNS.push({s:a, entry:e, ascii:/^[\x00-\x7F]+$/.test(a)}));
});
PATTERNS.sort((x,y)=>y.s.length - x.s.length);

function isAsciiAlnum(ch){ return ch && /[A-Za-z0-9_]/.test(ch); }

function findMatches(text){
  const lower = text.toLowerCase();
  const occupied = new Uint8Array(text.length);
  const matches = [];
  for(const p of PATTERNS){
    const key = p.s.toLowerCase();
    let idx = 0;
    while((idx = lower.indexOf(key, idx)) !== -1){
      const end = idx + key.length;
      let ok = true;
      if(p.ascii){
        if(isAsciiAlnum(text[idx-1]) || isAsciiAlnum(text[end])) ok = false;
      }
      if(ok){
        for(let k=idx;k<end;k++){ if(occupied[k]){ok=false;break;} }
      }
      if(ok){
        for(let k=idx;k<end;k++) occupied[k]=1;
        matches.push({start:idx, end:end, entry:p.entry, matched:text.slice(idx,end)});
      }
      idx = end;
    }
  }
  matches.sort((a,b)=>a.start-b.start);
  return matches;
}

/* ========== 渲染翻译结果 ========== */
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

let lastPlainText = "";

function renderResult(){
  const text = document.getElementById("input").value.trim();
  if(!text){ showToast("先把句子贴进来哦"); return; }

  const matches = findMatches(text);
  const resultArea = document.getElementById("resultArea");
  const welcomeCard = document.getElementById("welcomeCard");
  resultArea.classList.remove("hide");
  welcomeCard.classList.add("hide");

  // 原句高亮
  let origHtml = esc(text);
  for(let i=matches.length-1;i>=0;i--){
    const m = matches[i];
    origHtml = origHtml.slice(0,m.start) + "<mark>"+esc(text.slice(m.start,m.end))+"</mark>" + origHtml.slice(m.end);
  }
  document.getElementById("origOut").innerHTML = origHtml;

  // 大白话
  let plainHtml = "", plainText = "", cursor = 0;
  matches.forEach(m=>{
    plainHtml += esc(text.slice(cursor,m.start));
    plainText += text.slice(cursor,m.start);
    const rp = `<span class="bracket">「</span><span class="rp" title="${esc(m.entry.t)}：${esc(m.entry.say)}">${esc(m.entry.say)}</span><span class="bracket">」</span>`;
    plainHtml += rp;
    plainText += "「"+m.entry.say+"」";
    cursor = m.end;
  });
  plainHtml += esc(text.slice(cursor));
  plainText += text.slice(cursor);
  lastPlainText = plainText;

  if(matches.length===0){
    plainHtml = `这句话里没检测到词库收录的专业词 🤔<br>可能它本来就挺白话，或者词库里还没这个词——<b>把整句发给你的 Agent，可以补充新词</b>。`;
    lastPlainText = plainText;
  }
  document.getElementById("plainOut").innerHTML = plainHtml;

  // 名词卡片（去重，保持出现顺序）
  const seen = new Set();
  const cards = [];
  matches.forEach(m=>{
    if(!seen.has(m.entry)){ seen.add(m.entry); cards.push(m); }
  });
  document.getElementById("termNum").textContent = cards.length + " 个";
  document.getElementById("termCards").innerHTML = cards.map(m=>`
    <div class="term-card">
      <div class="term-head">
        <span class="term-name">${esc(m.entry.t)}</span>
        <span class="term-en">${esc(m.entry.en)}</span>
        <span class="badge b-${m.entry.cat}">${CAT_NAME[m.entry.cat]}</span>
      </div>
      <div class="term-desc">${esc(m.entry.d)}</div>
    </div>`).join("") || `<div class="empty" style="grid-column:1/-1">没有检测到专业名词</div>`;
}

/* ========== 词库视图 ========== */
let glossCat = "all";
function renderGloss(){
  const kw = document.getElementById("glossSearch").value.trim().toLowerCase();
  const list = GLOSSARY.filter(e=>{
    if(glossCat!=="all" && e.cat!==glossCat) return false;
    if(!kw) return true;
    const hay = (e.t+" "+e.en+" "+e.d+" "+(e.a||[]).join(" ")).toLowerCase();
    return hay.indexOf(kw) !== -1;
  });
  document.getElementById("glossCount").textContent =
    `共收录 ${GLOSSARY.length} 个术语，当前显示 ${list.length} 个`;
  document.getElementById("glossList").innerHTML = list.map(e=>`
    <div class="term-card">
      <div class="term-head">
        <span class="term-name">${esc(e.t)}</span>
        <span class="term-en">${esc(e.en)}</span>
        <span class="badge b-${e.cat}">${CAT_NAME[e.cat]}</span>
      </div>
      <div class="term-desc">${esc(e.d)}</div>
    </div>`).join("") || `<div class="empty" style="grid-column:1/-1">没搜到这个词，发给 Agent 补充进词库吧</div>`;
}

/* ========== 交互绑定 ========== */
const input = document.getElementById("input");
input.addEventListener("input",()=>{
  document.getElementById("charCount").textContent = input.value.length + " 字";
});
input.addEventListener("keydown",e=>{
  if((e.ctrl||e.meta) && e.key==="Enter") renderResult();
});
document.getElementById("goBtn").addEventListener("click",renderResult);
document.getElementById("clearBtn").addEventListener("click",()=>{
  input.value="";
  document.getElementById("charCount").textContent="0 字";
  document.getElementById("resultArea").classList.add("hide");
  document.getElementById("welcomeCard").classList.remove("hide");
  input.focus();
});
document.getElementById("copyBtn").addEventListener("click",()=>{
  if(!lastPlainText) return;
  navigator.clipboard.writeText(lastPlainText).then(()=>showToast("已复制大白话 ✅"))
    .catch(()=>showToast("复制失败，可手动选择复制"));
});
document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{
    input.value = EXAMPLES[+c.dataset.ex];
    document.getElementById("charCount").textContent = input.value.length+" 字";
    renderResult();
  });
});
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    const isT = t.dataset.view==="translator";
    document.getElementById("view-translator").classList.toggle("hide",!isT);
    document.getElementById("view-glossary").classList.toggle("hide",isT);
    if(!isT) renderGloss();
  });
});
document.querySelectorAll(".filter").forEach(f=>{
  f.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
    f.classList.add("active");
    glossCat = f.dataset.cat;
    renderGloss();
  });
});
document.getElementById("glossSearch").addEventListener("input",renderGloss);

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"),1800);
}

renderGloss();
</script>
</body>
</html>
